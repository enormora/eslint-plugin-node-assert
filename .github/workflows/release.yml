---
name: Release

on:
    workflow_dispatch:

permissions: {}

concurrency:
    group: release-pr
    cancel-in-progress: false

jobs:
    prepare-release:
        runs-on: ubuntu-24.04
        name: Prepare release pull request
        permissions:
            actions: write # required to dispatch release PR CI and delete gated PR runs
            contents: write # required to create or update the release branch
            issues: write # required to apply the release label to the release PR
            pull-requests: write # required to create, update, and close the release PR
            statuses: write # required to mirror dispatched release PR CI results
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.x
            - name: Install dependencies from the lockfile
              run: npm clean-install --ignore-scripts
            - name: Verify registry signatures for installed dependencies
              run: npm audit signatures
            - name: Verify `@packtory/cli` ships with a provenance attestation
              run: |
                  version=$(jq -r '.devDependencies["@packtory/cli"]' package.json)
                  spec="@packtory/cli@${version}"
                  attestation=$(npm view "${spec}" --json | jq -r '.dist.attestations // empty')
                  if [ -z "${attestation}" ]; then
                    echo "::error::${spec} is missing a provenance attestation; refusing to prepare a release"
                    exit 1
                  fi
                  echo "Verified ${spec} has a registered provenance attestation."
            - name: Prepare release pull request
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  npx just prepare-release
