name: Check pull request labels

on:
    pull_request:
        types: [opened, reopened, synchronize, labeled, unlabeled]
    merge_group:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check-labels:
        name: Check Labels
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read # required to inspect labels on the pull request event payload
        steps:
            - name: Validate labels
              env:
                  HAS_VALID_LABEL: >-
                      ${{ github.event_name != 'pull_request' ||
                      contains(github.event.pull_request.labels.*.name, 'release') ||
                      contains(github.event.pull_request.labels.*.name, 'breaking') ||
                      contains(github.event.pull_request.labels.*.name, 'bug') ||
                      contains(github.event.pull_request.labels.*.name, 'feature') ||
                      contains(github.event.pull_request.labels.*.name, 'enhancement') ||
                      contains(github.event.pull_request.labels.*.name, 'documentation') ||
                      contains(github.event.pull_request.labels.*.name, 'upgrade') ||
                      contains(github.event.pull_request.labels.*.name, 'refactor') ||
                      contains(github.event.pull_request.labels.*.name, 'build') }}
              run: |
                  if [ "$HAS_VALID_LABEL" != true ]; then
                      echo "None of the required pull request labels are set"
                      exit 1
                  fi
