---
name: Publish Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            release_pull_request_number:
                description: Merged release pull request number to retry publishing
                required: true
                type: string

permissions: {}

concurrency:
    group: publish-release
    cancel-in-progress: false

jobs:
    authorize-release-publish:
        runs-on: ubuntu-24.04
        name: Authorize release publish
        permissions:
            contents: read # required to check out the workflow source
            pull-requests: read # required to validate release PR identity and files
        outputs:
            should_publish: ${{ steps.authorize-publish.outputs.should_publish }}
            publish_commit_sha: ${{ steps.authorize-publish.outputs.publish_commit_sha }}
            release_commit_sha: ${{ steps.authorize-publish.outputs.release_commit_sha }}
            release_pull_request_number: ${{ steps.authorize-publish.outputs.release_pull_request_number }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.x
            - name: Install release workflow dependencies
              run: npm clean-install --ignore-scripts
            - name: Verify registry signatures for installed dependencies
              run: npm audit signatures
            - name: Verify `@packtory/cli` ships with a provenance attestation
              run: |
                  version=$(jq -r '.devDependencies["@packtory/cli"]' package.json)
                  spec="@packtory/cli@${version}"
                  attestation=$(npm view "${spec}" --json | jq -r '.dist.attestations // empty')
                  if [ -z "${attestation}" ]; then
                    echo "::error::${spec} is missing a provenance attestation; refusing to authorize publishing"
                    exit 1
                  fi
                  echo "Verified ${spec} has a registered provenance attestation."
            - name: Authorize release publish
              id: authorize-publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PULL_REQUEST_NUMBER: ${{ inputs.release_pull_request_number || '' }}
              run: |
                  set -euo pipefail

                  if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
                    if [ -z "${RELEASE_PULL_REQUEST_NUMBER}" ]; then
                      echo 'release_pull_request_number is required for manual publishing.'
                      exit 1
                    fi

                    npx just authorize-release-publish --release-pull-request "${RELEASE_PULL_REQUEST_NUMBER}"
                  else
                    npx just authorize-release-publish
                  fi

    publish-release:
        needs: authorize-release-publish
        if: needs.authorize-release-publish.outputs.should_publish == 'true'
        runs-on: ubuntu-24.04
        name: Publish release
        permissions:
            contents: write # required to create package tags and GitHub Releases
            id-token: write # required by npm Trusted Publishing to mint the OIDC token
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.authorize-release-publish.outputs.publish_commit_sha }}
                  fetch-depth: 0
                  path: target/release-source
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.x
            - name: Install release dependencies
              working-directory: target/release-source
              run: npm clean-install --ignore-scripts
            - name: Verify registry signatures for installed dependencies
              working-directory: target/release-source
              run: npm audit signatures
            - name: Verify `@packtory/cli` ships with a provenance attestation
              working-directory: target/release-source
              run: |
                  version=$(jq -r '.devDependencies["@packtory/cli"]' package.json)
                  spec="@packtory/cli@${version}"
                  attestation=$(npm view "${spec}" --json | jq -r '.dist.attestations // empty')
                  if [ -z "${attestation}" ]; then
                    echo "::error::${spec} is missing a provenance attestation; refusing to publish"
                    exit 1
                  fi
                  echo "Verified ${spec} has a registered provenance attestation."
            - name: Verify the exact release commit
              working-directory: target/release-source
              run: npx just test
            - name: Publish release
              id: publish-release
              working-directory: target/release-source
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -o pipefail
                  mkdir -p target/release
                  npx just publish-release 2>&1 | tee target/release/publish.log
            # The `sigstore` wrapper used by `libnpmpublish` hardcodes
            # `fetchOnConflict: false`, so a retried Rekor POST after a
            # transient blip surfaces as
            # `error creating tlog entry - (409) an equivalent entry already exists`
            # even though the original submission landed. Re-running publish
            # mints a fresh OIDC cert, so the next signature differs and
            # Rekor accepts it.
            - name: Re-publish release after a transient sigstore failure
              if: steps.publish-release.outcome == 'failure'
              working-directory: target/release-source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if grep -Eiq 'OIDC token exchange failed with status 404' target/release/publish.log; then
                    echo 'npm Trusted Publishing is not configured correctly for this workflow.'
                    echo 'Expected npm Trusted Publishing workflow filename: publish-release.yml'
                    exit 1
                  fi

                  if grep -Eiq 'attestation|oidc|provenance|rekor|sigstore|tlog' target/release/publish.log; then
                    sleep 30
                    npx just publish-release
                    exit 0
                  fi

                  exit 1
